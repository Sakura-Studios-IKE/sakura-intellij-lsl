pluginGroup = com.sakurastudios.lsl
pluginName = sakura-lsl
pluginVersion = 1.0.3

# Platform versions
javaVersion = 17
kotlinVersion = 2.3.0
platformType = IU
# We compile against the latest stable IntelliJ Platform (2026.x).
# Plugin-binary compatibility with older IDEs is governed by sinceBuild
# (which stays at 241), but the *test sandbox* and the compile-target
# match the maintainer's everyday IDE so issues surface immediately.
# 2026.1.x is in the metadata but not yet on the download mirror as of
# build time. 2025.3.5 (build 253) is API-compatible with 2026.1 (build
# 261) for the stable platform APIs we use, so the compiled binary loads
# fine on the user's 2026.1 IDE via the sinceBuild=241..untilBuild=299.*
# range. Bump this when a 2026.x ideaIC artefact becomes downloadable.
platformVersion = 2025.3.5
# sinceBuild 253 = 2025.3. Six of our API calls (DirectoryProjectGenerator,
# JDOMExternalizerUtil and friends) are marked @ApiStatus.Internal in 2024.1
# – 2025.2 but were promoted to @Experimental in 253+, where the Marketplace
# verifier permits them. Lower this only after replacing those calls with
# public-API equivalents.
pluginSinceBuild = 253
# Latest available shipping build is 262 (2026.2 EAP); keep the upper bound
# tight so the Marketplace verifier doesn't flag it as "too wide".
pluginUntilBuild = 262.*

# Gradle
org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel = true
org.gradle.caching = true

# Kotlin
kotlin.stdlib.default.dependency = false
kotlin.incremental.useClasspathSnapshot = true
