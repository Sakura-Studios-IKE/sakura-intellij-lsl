name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3

      - name: Build plugin
        run: ./gradlew --no-daemon buildPlugin

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: sakura-lsl-plugin
          path: build/distributions/sakura-lsl-*.zip

  publish-marketplace:
    name: Publish to JetBrains Marketplace
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3

      - name: Patch plugin.xml change-notes from CHANGELOG
        run: ./gradlew --no-daemon patchChangelog

      - name: Publish
        continue-on-error: true
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon publishPlugin

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: sakura-lsl-plugin, path: ./artifacts }
      - id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {flag=1; next} flag && /^## \[/ {flag=0} flag' CHANGELOG.md > release-body.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: sakura-intellij-lsl ${{ steps.changelog.outputs.version }}
          body_path: release-body.md
          files: artifacts/*.zip
